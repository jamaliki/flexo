[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flexo"
version = "0.1.0"
description = "A semantic compiler for editable scientific figures"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kiarash Jamali" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["scientific-visualization", "svg", "neural-networks", "inkscape"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "fonttools>=4.59",
  "jsonschema>=4.25",
  "pyyaml>=6.0.2",
  "resvg-py>=0.2",
  "ruamel.yaml>=0.18",
  "uharfbuzz>=0.52",
]

[project.optional-dependencies]
assistant = ["anthropic>=1.9", "openai>=1.60"]  # Claude; ChatGPT and other models
structures = ["gemmi>=0.6"]
molecules = ["molsketch @ git+https://github.com/jamaliki/mol-sketch#subdirectory=python"]
pdf = ["pypdfium2>=4.30", "pillow>=10"]  # PDF pages and Illustrator files as artwork

[project.scripts]
flexo = "flexo.cli:main"

[dependency-groups]
dev = [
  "anthropic>=1.9",
  "openai>=1.60",
  "gemmi>=0.6",
  "hypothesis>=6.138",
  "pillow>=10",
  "pypdfium2>=5.13.0",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.hatch.metadata]
allow-direct-references = true  # mol-sketch is installed from its repository

[tool.hatch.build.targets.wheel]
packages = ["src/flexo"]

[tool.hatch.build.targets.sdist]
include = ["src/flexo", "schemas", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
branch = true
source = ["flexo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
